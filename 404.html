<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Przekierowanie… — zanim zniknie</title>
<style>
  html,body{height:100%;margin:0;background:#04040A;color:#e8e8f0;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center}
  .box{max-width:440px;padding:32px}
  .ring{width:44px;height:44px;margin:0 auto 20px;border-radius:50%;
    border:3px solid rgba(255,255,255,.15);border-top-color:#19f0c8;
    animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  a{color:#19f0c8}
  small{opacity:.6;display:block;margin-top:18px}
</style>
</head>
<body>
  <div class="box">
    <div class="ring"></div>
    <p id="msg">Przenosimy Cię do produktu…</p>
    <small>Jeśli nic się nie stanie, <a id="fallback" href="https://zanim-zniknie.pl/">wróć na stronę główną</a>.</small>
  </div>
<script>
(function () {
  // Branded redirect shim. GitHub Pages serves this 404.html for any unmatched
  // path. We map  /products/<handle>?utm_*  ->  Shopify, preserving all query
  // params so attribution (UTM) flows into Shopify analytics.
  var STORE = "https://ngrfkd-2g.myshopify.com";
  var path = window.location.pathname || "";
  var search = window.location.search || "";
  var m = path.match(/\/products\/([^\/?#]+)/);

  var target;
  if (m && m[1]) {
    target = STORE + "/products/" + m[1] + search;
  } else {
    // Unknown path — send to the storefront homepage (with any params kept).
    target = "https://zanim-zniknie.pl/" + search;
    document.getElementById("msg").textContent = "Ta strona nie istnieje — wracamy na stronę główną…";
  }
  document.getElementById("fallback").href = target;
  // Replace so the 404 URL doesn't pollute history/back button.
  window.location.replace(target);
})();
</script>
</body>
</html>
