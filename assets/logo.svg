    .w { font-family:"Inter","Segoe UI",system-ui,Arial,sans-serif; font-weight:800; font-size:56px; letter-spacing:-1.5px; }
    .a { fill:#EAF6F0; }
    .b { fill:#00FFB2; }
  </style>
  <text x="24" y="76" class="w"><tspan class="a">zanim </tspan><tspan class="b">zniknie</tspan></text>
